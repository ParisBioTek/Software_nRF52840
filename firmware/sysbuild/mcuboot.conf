# Serial recovery via USB CDC ACM
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Wait 5 s for DFU after reset (no dedicated boot button — reset is the only entry point)
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=30000
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# La carte utilise U5, oscillateur CMOS actif OV-7604-C7 sur XL1 (±20 ppm),
# pas le quartz 32,768 kHz du DK.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_EXT_FULL_SWING=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# Flash + GPIO
CONFIG_GPIO=y
CONFIG_FLASH=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_BOOT_MAX_LINE_INPUT_LEN=8192
