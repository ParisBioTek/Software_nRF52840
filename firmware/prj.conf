# ── Bluetooth ─────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NFC_AUTH_DK"
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_CTLR_SDC_LLPM=n   
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_MAX_CONN=1

# ── NFC T2T (pas T4T — le code utilise nfc_t2t_lib.h) ────────────────────
CONFIG_NFC_T2T_NRFXLIB=y          # ← T2T, pas T4T
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_LE_OOB_REC=y

# ── Flash + NVS ───────────────────────────────────────────────────────────
# Le driver Flash interne nRF doit être activé en premier
CONFIG_FLASH=y
CONFIG_SOC_FLASH_NRF=y             # ← active le driver Flash nRF52840
CONFIG_FLASH_PAGE_LAYOUT=y         # dépend de SOC_FLASH_NRF → OK maintenant
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y              # backend NVS pour les settings BLE (liaisons)

# ── Logging ───────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Gestion d'alimentation ────────────────────────────────────────────────
# Pas de CONFIG_PM=y : HAS_PM n'est pas sélectionné pour nRF52840 en Zephyr 4.x.
# Le scheduler Zephyr fait automatiquement WFI (System ON sleep) quand inactif —
# comportement identique à ce qu'on cherche.

# ── ADC (SAADC) pour lecture tension VBUS ────────────────────────────────
CONFIG_ADC=y

# ── SPI (AD5940) ──────────────────────────────────────────────────────────
CONFIG_SPI=y
CONFIG_PINCTRL=y

# MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# USB (API NCS 3.x)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UART_LINE_CTRL=y

# mcumgr core + dépendances complètes
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y

# mcumgr groups (noms NCS 3.x)
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y

CONFIG_MCUMGR_TRANSPORT_UDP=n
CONFIG_USBD_CDC_ACM_CLASS=y
# DFU USB mcumgr sur le port CDC. Le pilotage CV passe par un groupe SMP custom
# sur CE MÊME canal (multiplexé par mcumgr) → 1 seul port, pas de conflit.
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_LINE_CTRL=y

# Le canal SMP doit rester PROPRE : on ne met AUCUN texte console/log sur l'UART
# (ça corromprait les trames SMP). Console + logs partent sur RTT (J-Link).
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Pool de buffers du contrôleur USB : 1024 o (défaut) trop petit (échec
# "udc: Failed to allocate net_buf"). On l'agrandit.
CONFIG_UDC_BUF_POOL_SIZE=16384
CONFIG_UDC_BUF_COUNT=32

CONFIG_REBOOT=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

# Image manager + dépendances explicites
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_MCUMGR_TRANSPORT_UART_ASYNC=n

CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=6